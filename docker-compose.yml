version: "3.9"

services:
  relay:
    build: ./relay
    container_name: relay
    ports:
      - "8000:8000"
    volumes:
      - ./shared:/app/shared
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  endpoint:
    build: ./endpoint
    container_name: endpoint
    ports:
      - "8001:8001"
    volumes:
      - ./shared:/app/shared
    command: uvicorn main:app --host 0.0.0.0 --port 8001
