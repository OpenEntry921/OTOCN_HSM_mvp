version: "3.9"

services:
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    container_name: hsm-relay
    ports:
      - "8000:8000"
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET:-replace-this-with-a-long-random-secret}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-30}
      ENDPOINT_URL: ${ENDPOINT_URL:-http://endpoint:8001/execute}
      RELAY_AUDIT_LOG_PATH: ${RELAY_AUDIT_LOG_PATH:-/app/logs/relay_audit.log}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - endpoint
    command: uvicorn relay.main:app --host 0.0.0.0 --port 8000

  endpoint:
    build:
      context: .
      dockerfile: endpoint/Dockerfile
    container_name: hsm-endpoint
    ports:
      - "8001:8001"
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET:-replace-this-with-a-long-random-secret}
    command: uvicorn endpoint.main:app --host 0.0.0.0 --port 8001
